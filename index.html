<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Chandni" />
<title>Chandni Pick'em</title>
<style>
  :root {
    --page:#E7EFEC; --sand:#EFE4CE; --panel:#FDFCF7; --ink:#0F3B44; --blue:#1C7C8C;
    --gold:#EE8A3C; --muted:#65807F; --line:#D6DFD9; --win:#177E63; --loss:#C4523F;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; color:var(--ink); font-family:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background:linear-gradient(180deg,var(--page) 0%,var(--page) 55%,var(--sand) 100%);
    background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; }
  .wrap { max-width:620px; margin:0 auto; }
  .mark { font-family:"Haettenschweiler","Arial Narrow Bold","HelveticaNeue-CondensedBlack","Avenir Next Condensed",Impact,"Arial Narrow",sans-serif;
          font-weight:900; text-transform:uppercase; letter-spacing:1.4px; line-height:.92; }
  header { padding:18px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .sub { font-size:12px; color:var(--muted); margin-top:5px; }
  nav { position:sticky; top:0; z-index:5; background:var(--page); padding:8px 16px 10px; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:6px; }
  .tab { flex:1; padding:10px 0; font-size:14px; font-weight:700; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .pill { flex:1; padding:8px 0; font-size:12px; font-weight:700; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); }
  .pill.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  main { padding:12px 12px 124px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; overflow:hidden; }
  .meta { display:flex; justify-content:space-between; padding:7px 12px 0; font-size:11.5px; color:var(--muted); }
  .sides { display:flex; }
  .side { flex:1; text-align:left; padding:11px 12px; border:none; background:transparent; display:flex; align-items:center; gap:8px; }
  .side.on { color:#fff; }
  .divider { width:1px; background:var(--line); margin:10px 0; }
  .abbr { font-size:16.5px; font-weight:800; letter-spacing:-.3px; }
  .spread { font-size:12.5px; font-weight:600; opacity:.6; }
  .tname { font-size:11.5px; opacity:.55; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
         background:linear-gradient(to top,var(--sand) 62%,rgba(239,228,206,0)); }
  .bar .inner { max-width:620px; margin:0 auto; }
  .btn { width:100%; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:800; background:var(--ink); color:#fff; }
  .btn.go { background:var(--gold); color:#241A00; }
  .btn:disabled { opacity:.45; }
  .locked { display:flex; align-items:center; justify-content:space-between; background:var(--ink); color:#fff; border-radius:14px; padding:14px 18px; font-weight:700; }
  .ghost { background:transparent; border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:999px; padding:6px 12px; font-size:12.5px; }
  .row { display:flex; align-items:center; gap:11px; padding:12px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:none; }
  /* standings plates */
  .prow { position:relative; margin-bottom:7px; transform:skewX(-9deg); border-radius:3px; }
  .prow .prin { position:relative; z-index:5; display:flex; align-items:center; gap:11px;
                padding:11px 14px; transform:skewX(9deg); }
  .prow.leader { box-shadow:0 0 22px -8px var(--gold); }
  .prow.dead { opacity:.45; }
  .pring.gold rect { stroke:var(--gold); stroke-width:2.4; }

  /* who picked what */
  .gridwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line);
              border-radius:12px; background:var(--panel); }
  .gridwrap::-webkit-scrollbar { display:none; }
  .grid { display:grid; min-width:100%; }
  .gcell { padding:9px 5px; font-size:14px; font-weight:800; text-align:center;
           border-bottom:1px solid var(--line); border-left:1px solid var(--line);
           display:flex; align-items:center; justify-content:center; gap:3px; }
  .gcell.ghead { position:sticky; top:0; background:var(--panel); font-size:11.5px; letter-spacing:.4px;
                 color:var(--ink); z-index:3; padding:8px 4px; flex-direction:column; gap:3px; }
  .hteams { display:flex; align-items:center; gap:3px; }
  .hteams img { width:20px; height:20px; object-fit:contain; }
  .hteams u { text-decoration:none; font-size:8px; color:var(--muted); font-weight:700; }
  .gcell.gname, .gcell.corner { position:sticky; left:0; background:var(--panel); z-index:2;
                 border-left:none; justify-content:flex-start; font-size:13.5px; gap:6px; }
  .gcell.gname.lead { background:linear-gradient(90deg, rgba(238,138,60,.22), rgba(238,138,60,.04));
                      box-shadow:inset 0 0 0 2px var(--gold); }
  .gcell.gname u { text-decoration:none; font-size:11px; color:var(--muted); font-weight:800;
                   margin-left:5px; font-variant-numeric:tabular-nums; }
  .gcell.muted { opacity:.22; }
  .gcell.gname.muted { opacity:.35; }
  .gcell.corner { z-index:4; }
  .gcell.ghead span { color:var(--muted); font-weight:700; font-size:8.5px; display:block; }
  .gcell.ghead b { display:block; font-size:9px; color:var(--win); letter-spacing:.6px; font-weight:900; }
  .gcell.ghead b.live { color:var(--gold); }
  .gcell.gname b { margin-left:auto; font-size:22px; line-height:1; color:var(--ink); font-weight:900;
                   font-variant-numeric:tabular-nums; }
  .gcell.gname.me { background:rgba(0,0,0,.04); }
  .gcell.gname.cmp { box-shadow:inset 3px 0 0 var(--gold); }
  .gcell.pick.differs { box-shadow:inset 0 0 0 3px var(--ink), 0 0 0 1px var(--ink); z-index:1; }
  .gcell.pick.differs::before { content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
                                background:var(--ink); }
  .gcell.pick.agrees { opacity:.34; }

  .sclabel { font-size:9.5px; letter-spacing:2px; font-weight:900; color:var(--muted);
             padding:18px 3px 8px; }
  .scwrap { display:flex; gap:8px; }
  .sccard { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 10px; }
  .schead { display:flex; align-items:center; gap:6px; }
  .schead img { width:22px; height:22px; object-fit:contain; }
  .schead span { font-size:9.5px; letter-spacing:1.2px; font-weight:900; color:var(--muted); }
  .scwin { font-size:13px; font-weight:800; margin:7px 0 9px; line-height:1.3; }
  .scrow { display:flex; align-items:center; gap:6px; padding:4px 0; }
  .scpos { width:12px; font-size:10px; font-weight:800; color:var(--muted); }
  .scname { flex:1; font-size:12.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scgain { font-size:9.5px; font-weight:900; color:var(--win); }
  .scpts { font-size:15px; font-weight:900; font-variant-numeric:tabular-nums; }
  .scrow.win { background:linear-gradient(90deg, rgba(238,138,60,.16), transparent);
               box-shadow:inset 0 0 0 1.5px var(--gold); border-radius:6px; padding:4px 6px; }
  .cmpbar { margin-bottom:9px; }
  .cmplabel { font-size:9.5px; letter-spacing:1.8px; font-weight:800; color:var(--muted); padding:0 3px 6px; }
  .cmprow { display:flex; gap:5px; overflow-x:auto; padding-bottom:2px; }
  .cmprow::-webkit-scrollbar { display:none; }
  .cmpchip { flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:7px 11px; border-radius:999px;
             border:1px solid var(--line); background:var(--panel); font-size:12px; font-weight:700; color:var(--muted); }
  .cmpchip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .cmpchip b { color:var(--gold); font-size:11px; }
  .cmpchip i { font-style:normal; font-size:11px; opacity:.7; }

  .verdict { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;
             background:var(--panel); }
  .v-top { font-size:14px; font-weight:800; }
  .v-top span { color:var(--gold); }
  .v-mid { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .v-bot { font-size:13.5px; font-weight:800; margin-top:7px; }
  .v-label { font-size:9px; letter-spacing:1.8px; font-weight:800; color:var(--muted); margin:12px 0 6px; }
  .swrow { display:flex; align-items:center; gap:7px; padding:7px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .sw-team { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:900; color:#fff;
             background:var(--c); padding:4px 8px; border-radius:5px; }
  .sw-team img { width:18px; height:18px; object-fit:contain; }
  .sw-team i { font-style:normal; font-size:10px; color:var(--gold); }
  .sw-none { font-size:12px; color:var(--muted); font-style:italic; }
  .sw-vs { font-size:9.5px; letter-spacing:1.2px; color:var(--muted); font-weight:800; }
  .sw-meta { margin-left:auto; font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.3px; }
  .v-range { display:flex; gap:10px; margin-top:11px; padding-top:10px; border-top:1px solid var(--line); }
  .v-range span { flex:1; font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.4px; }
  .v-range b { display:block; font-size:16px; color:var(--ink); font-weight:900;
               font-variant-numeric:tabular-nums; margin-top:2px; }
  .gcell.gname b { margin-left:auto; font-size:9.5px; letter-spacing:.6px; color:var(--win); }
  .gcell.gname b.live { color:var(--gold); }
  .gcell.pick { color:#fff; background:var(--c); position:relative; padding:6px 4px 9px; overflow:hidden; }
  .gcell.pick img { width:30px; height:30px; object-fit:contain;
                    filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .gcell.pick i.mlk { position:absolute; left:0; right:0; bottom:0; font-style:normal;
                      font-size:7.5px; letter-spacing:.8px; font-weight:900; line-height:1;
                      padding:2px 0; background:var(--gold); color:#241A00; }
  .gcell.pick i.mlk.lo { background:var(--ink); color:var(--gold); }
  .gcell.pick.right::after { content:"✓"; position:absolute; right:3px; top:2px; font-size:11px;
                             font-weight:900; opacity:.95; }
  .gcell.pick.wrong { opacity:.4; }
  .gcell.empty { color:var(--line); }


  /* survivor board */
  .svhead { display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--muted);
            padding:0 4px 10px; font-weight:600; }
  .svhead b { font-size:22px; color:var(--ink); font-weight:900; }
  .svhead span { margin-left:auto; font-size:10px; letter-spacing:1.2px; font-weight:700; }
  .sv-tag { display:inline-block; margin-top:4px; font-size:9px; letter-spacing:1.4px; font-weight:900;
            padding:3px 7px; border-radius:999px; }
  .sv-tag.alive { color:var(--win); background:rgba(23,126,99,.12); }
  .sv-tag.mull  { color:var(--gold); background:rgba(238,138,60,.14); }
  .sv-tag.out   { color:var(--loss); background:rgba(196,82,63,.14); }
  .svrow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .svhist { display:flex; gap:4px; }
  .svchip { width:23px; height:23px; border-radius:12px; background:#fff; display:inline-flex;
            align-items:center; justify-content:center; flex-shrink:0; }
  .svchip img { width:15px; height:15px; object-fit:contain; }
  .svchip.won  { box-shadow:inset 0 0 0 2px var(--win); }
  .svchip.lost { box-shadow:inset 0 0 0 2px var(--loss); }
  .svchip.lost img { filter:grayscale(.7); opacity:.75; }
  .sv-tag { margin-top:0 !important; }
  .sv-team { display:inline-flex; align-items:center; gap:6px; font-size:16px; font-weight:900;
             color:#fff; background:var(--c); padding:7px 11px; border-radius:6px; }
  .sv-team img { width:20px; height:20px; object-fit:contain; }
  .sv-hidden { font-size:10px; letter-spacing:1.4px; font-weight:800; color:var(--muted);
               border:1px dashed var(--line); padding:7px 10px; border-radius:6px; }
  .sv-none { font-size:11.5px; color:var(--muted); font-style:italic; }

  .row.leader { position:relative; background:linear-gradient(90deg, rgba(238,138,60,.10), rgba(238,138,60,0) 60%);
                box-shadow:inset 0 0 0 2px var(--gold), 0 0 18px -6px var(--gold); border-radius:12px; }
  .row.dead { opacity:.45; }
  .crestwrap { position:relative; display:inline-flex; flex-shrink:0; }
  .crown { position:absolute; left:-6px; top:-7px; z-index:6; pointer-events:none;
           transform:rotate(-18deg); filter:drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .crest { position:relative; display:inline-flex; align-items:center; justify-content:center; background:#fff; flex-shrink:0; }
  .badge { position:absolute; right:-4px; bottom:-4px; font-size:8.5px; font-weight:800; color:#fff; padding:2px 3.5px; border-radius:5px; border:1.5px solid #fff; line-height:1; }
  .rec { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .note { font-size:12.5px; color:var(--muted); line-height:1.5; padding:10px 4px; }
  .warn { background:#FBE6E2; border:1px solid var(--loss); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:13px; line-height:1.45; }
  .flag { background:#FDF0DE; border:1px solid var(--gold); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:12.5px; line-height:1.45; }
  .serif { font-family:Georgia,"Iowan Old Style",serif; }
  .mlock { width:100%; background:transparent; border:none; padding:5px 2px; font-size:12px;
           font-weight:700; color:var(--muted); letter-spacing:.3px; text-align:center; }
  .mlock.on { color:var(--blue); }
  .veil { position:fixed; inset:0; z-index:50; background:rgba(15,59,68,.45); display:flex; align-items:flex-end; animation:fade .18s ease both; }
  .sheet { width:100%; max-width:620px; margin:0 auto; background:var(--panel); border-radius:20px 20px 0 0; padding:10px 18px 26px; animation:up .3s cubic-bezier(.22,.9,.28,1) both; }
  .toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--gold); color:#241A00; padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:40; }
  #blast { position:fixed; inset:0; z-index:70; pointer-events:none; display:none; }
  #blast.on { display:block; }
  .fl { position:absolute; inset:0; background:#FFF3D8; animation:fl 1s ease-out both; }
  .vl { position:absolute; inset:0; background:rgba(15,59,68,.55); animation:fade .2s ease both; }
  .bl { position:absolute; left:50%; top:50%; text-align:center; animation:bl 1.5s cubic-bezier(.2,.9,.3,1) both; }
  .bl .t1 { font-size:44px; color:var(--gold); -webkit-text-stroke:2px #0F3B44; }
  .bl .t2 { font-size:60px; color:#FFF3D8; -webkit-text-stroke:2px #0F3B44; }
  .bl img { display:block; width:230px; border-radius:12px; }
  .frame { margin-top:12px; padding:5px; background:var(--gold); border-radius:16px; transform:rotate(-3deg); box-shadow:0 10px 30px rgba(0,0,0,.35); }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  @keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes fl { 0%{opacity:0} 10%{opacity:.9} 26%{opacity:.05} 42%{opacity:.65} 60%{opacity:.05} 100%{opacity:0} }
  @keyframes bl { 0%{transform:translate(-50%,-50%) scale(.35) rotate(-10deg);opacity:0}
                  16%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
                  80%{transform:translate(-50%,-50%) scale(1);opacity:1}
                  100%{transform:translate(-50%,-50%) scale(1.25);opacity:0} }
  @media (prefers-reduced-motion:reduce){ .fl,.bl,.sheet,.veil{animation-duration:.2s} }

  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:290px; margin:14px auto 0; }
  .key { height:62px; border-radius:16px; border:1px solid var(--line); background:var(--panel);
         font-size:24px; font-weight:600; }
  .key:active { background:var(--line); }

  /* ---- pick plates ---- */
  .plates { position:relative; margin-bottom:9px; }
  .bug { position:relative; display:flex; height:60px; gap:5px; }
  .seg { position:relative; flex:1; border:none; padding:0; background:transparent;
         transform:skewX(-13deg); border-radius:2px; overflow:visible;
         transition:opacity 280ms ease, filter 280ms ease; }
  .pface { position:absolute; inset:0; border-radius:2px; overflow:hidden;
           background:linear-gradient(180deg,#FDFDFB 0%,#F6F6F2 47%,#E9E9E3 48%,#F3F3EF 100%);
           transition:background 240ms ease; }
  .psheen { position:absolute; inset:0; z-index:3; pointer-events:none; border-radius:2px; overflow:hidden;
            background:
              radial-gradient(130% 76% at 10% -14%, rgba(255,255,255,.45), rgba(255,255,255,0) 58%),
              linear-gradient(180deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.06) 46%,
                              rgba(255,255,255,0) 47%, rgba(255,255,255,.08) 100%); }
  .phair { position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:2px;
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), inset 0 0 0 1.5px rgba(20,30,35,.13); }
  .pinner { position:relative; z-index:5; height:100%; display:flex; align-items:center; gap:10px;
            padding:0 13px; transform:skewX(13deg); }
  .plogo { width:29px; height:29px; flex-shrink:0; object-fit:contain;
           filter:drop-shadow(0 1px 1px rgba(58,22,32,.2)); }
  .pabbr { font-style:italic; font-weight:800; letter-spacing:-.6px; font-size:21px; line-height:1;
           color:#1B262C; transition:color 220ms ease; }
  .ptag { font-size:8px; letter-spacing:1.8px; font-weight:700; color:var(--muted); margin-top:4px; }
  .pval { margin-left:auto; font-size:18px; font-weight:800; color:var(--muted);
          font-variant-numeric:tabular-nums; transition:color 220ms ease; }
  .seg.on .pface { background:linear-gradient(180deg,var(--teamHi) 0%,var(--team) 46%,
                    var(--teamLo) 47%,var(--teamMid) 100%); }
  .seg.on .pabbr, .seg.on .pval { color:#FBF9F7; text-shadow:0 1px 1px rgba(0,0,0,.22); }
  .seg.on .ptag { color:rgba(255,255,255,.72); }
  .seg.off { opacity:.5; filter:saturate(.6); }
  .seg[disabled] { opacity:.4; }
  .pring { position:absolute; inset:0; z-index:7; pointer-events:none; overflow:visible; }
  .pring rect { fill:none; stroke:#C9D2DA; stroke-width:1.6; }
  .glint { position:absolute; inset:0; z-index:8; pointer-events:none; border-radius:2px; overflow:hidden; }
  .glint::after { content:""; position:absolute; top:-20%; bottom:-20%; width:38%; left:-45%;
                  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.42), rgba(255,255,255,0));
                  animation:glint 520ms cubic-bezier(.35,.6,.3,1) both; }
  @keyframes glint { 0%{left:-45%;opacity:0} 14%{opacity:.8} 100%{left:112%;opacity:0} }
  .stamp { position:absolute; left:50%; top:50%; z-index:60; pointer-events:none;
           transform:translate(-50%,-50%) rotate(-11deg); mix-blend-mode:multiply;
           animation:stampin 900ms cubic-bezier(.2,1.5,.35,1) both; }
  .stamp img { width:74px; height:74px; object-fit:contain;
               filter:url(#grit) saturate(.92) contrast(1.05); opacity:.94; }
  @keyframes stampin {
    0%{transform:translate(-50%,-50%) rotate(-24deg) scale(2.6);opacity:0}
    18%{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:.95}
    24%{transform:translate(-50%,-50%) rotate(-11deg) scale(1.05);opacity:.95}
    32%{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:.95}
    72%{opacity:.9} 100%{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:0} }
  .pmid { width:52px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          transform:skewX(-13deg); border-radius:2px;
          background:linear-gradient(180deg,#FCFBF9 0%,#F4F2EE 47%,#E7E3DB 48%,#F1EEE9 100%);
          box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), inset 0 0 0 1.5px rgba(58,22,32,.12); }
  .pmid > * { transform:skewX(13deg); }
  .pmid b { font-size:15px; color:var(--ink); font-weight:800; font-variant-numeric:tabular-nums; }
  .pmid span { font-size:6.5px; letter-spacing:1.4px; color:var(--muted); margin-top:3px; font-weight:700; }
  .peek { display:flex; gap:5px; padding:6px 2px 2px; overflow-x:auto; -webkit-overflow-scrolling:touch;
          scrollbar-width:none; }
  .peek::-webkit-scrollbar { display:none; }
  .wk { flex:0 0 auto; }
  .wk { display:inline-flex; align-items:baseline; gap:5px; padding:4px 8px; border-radius:4px;
